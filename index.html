<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Habit Tracker</h1>

    <form id="habit-form">
      <input id="habit-input" type="text" placeholder="Add a habit (e.g. Read 10 pages)" required />
      <button type="submit">Add</button>
    </form>

    <ul id="habit-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
